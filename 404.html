<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | QR Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body class="gradient-bg min-h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="mb-8">
            <div class="text-8xl mb-4">🔍</div>
            <h1 class="text-6xl font-bold text-white mb-4">404</h1>
            <h2 class="text-2xl font-semibold text-white/90 mb-6">Page Not Found</h2>
            <p class="text-lg text-white/80 mb-8 max-w-md mx-auto">
                The page you're looking for doesn't exist. Let's get you back to creating amazing QR codes!
            </p>
        </div>
        
        <div class="space-y-4">
            <a href="/" class="inline-flex items-center px-6 py-3 bg-white text-purple-600 font-semibold rounded-lg hover:bg-gray-100 transition-colors duration-200">
                <i class="fas fa-home mr-2"></i>
                Back to QR Studio
            </a>
            
            <div class="flex flex-wrap justify-center gap-4 mt-6">
                <a href="/?action=create" class="flex items-center px-4 py-2 bg-white/10 backdrop-blur-sm text-white rounded-lg hover:bg-white/20 transition-colors duration-200">
                    <i class="fas fa-plus mr-2"></i>
                    Create QR Code
                </a>
                
                <a href="/?type=wifi" class="flex items-center px-4 py-2 bg-white/10 backdrop-blur-sm text-white rounded-lg hover:bg-white/20 transition-colors duration-200">
                    <i class="fas fa-wifi mr-2"></i>
                    WiFi QR
                </a>
                
                <a href="/?type=vcard" class="flex items-center px-4 py-2 bg-white/10 backdrop-blur-sm text-white rounded-lg hover:bg-white/20 transition-colors duration-200">
                    <i class="fas fa-id-card mr-2"></i>
                    Business Card
                </a>
            </div>
        </div>
        
        <footer class="mt-12 text-white/60 text-sm">
            <p>&copy; 2024 QR Studio. Built with ❤️</p>
        </footer>
    </div>
    
    <script>
        // Auto redirect after 10 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 10000);
        
        // Add some particle effects
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'fixed w-2 h-2 bg-white/20 rounded-full pointer-events-none';
            particle.style.left = Math.random() * window.innerWidth + 'px';
            particle.style.top = window.innerHeight + 'px';
            particle.style.animation = `float ${Math.random() * 3 + 2}s linear infinite`;
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 5000);
        }
        
        // Create floating particles
        setInterval(createParticle, 300);
        
        // Add CSS animation for particles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                from {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                }
                to {
                    transform: translateY(-100vh) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
